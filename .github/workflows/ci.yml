name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: financial_proof
          POSTGRES_PASSWORD: financial_proof
          POSTGRES_DB: financial_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial_proof -d financial_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://financial_proof:financial_proof@localhost:5432/financial_proof
      APP_NAME: Financial Proof
      APP_VERSION: 0.1.0
      DEBUG: "false"
      API_HOST: 127.0.0.1
      API_PORT: 8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing